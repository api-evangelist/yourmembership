aid: yourmembership
url: https://raw.githubusercontent.com/api-evangelist/yourmembership/refs/heads/main/apis.yml
name: YourMembership
kind: company
description: >-
  YourMembership is an association management system (AMS) and membership
  management platform for professional associations, nonprofits, clubs, and
  member-based organizations, covering member records and profiles, dues and
  membership types, events and registration, online community, e-commerce/store,
  fundraising, an online career center (YMCareers job board), and learning. It is
  owned by Community Brands (now operating under Momentive Software / the Personify
  portfolio). YourMembership exposes a documented developer API - a modern REST API
  (base https://ws.yourmembership.com, OAuth-authenticated, with a Swagger UI and a
  metadata document) plus a legacy XML/RPC API (v2.00), and a separate REST YMCareers
  API for the job-board product (base https://api.careerwebsite.com/v1). API access
  is license/partner gated - customers must license the REST API before an integration
  partner can connect - so the full Swagger reference is not publicly enumerable, and
  the endpoint set below is grounded in YourMembership's public integration guides and
  SDKs and otherwise honestly modeled.
