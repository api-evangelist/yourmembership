apis:
- aid: yourmembership:yourmembership-members-api
  name: YourMembership Members API
  tags:
  - Members
  - Contacts
  - Profiles
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.yourmembership.com/api/
  baseURL: https://ws.yourmembership.com
  properties:
  - url: https://www.yourmembership.com/api/
    type: Documentation
  - url: https://ws.yourmembership.com/swagger-ui/
    type: APIReference
  - url: openapi/yourmembership-openapi.yml
    type: OpenAPI
  description: Read and manage member and contact records - member lists, profiles,
    account details, custom fields, membership types, and groups - via the REST
    MemberProfile and People endpoints under /Ams. Requests are OAuth-authenticated
    after POST /Ams/Authenticate. Access requires licensing the REST API from
    YourMembership. Endpoint paths beyond the documented Authenticate/MemberProfile/People
    surface are modeled from public integration guides.
- aid: yourmembership:yourmembership-events-api
  name: YourMembership Events API
  tags:
  - Events
  - Registration
  - Calendar
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.yourmembership.com/api/
  baseURL: https://ws.yourmembership.com
  properties:
  - url: https://www.yourmembership.com/api/
    type: Documentation
  - url: openapi/yourmembership-openapi.yml
    type: OpenAPI
  description: Retrieve events, event details, and event registrations (the YM Events
    module) so that calendars and registration data can be synced to external
    systems. Grounded in the documented Events search capability of the legacy XML
    API and the YM Events integration surface; specific REST paths are modeled.
- aid: yourmembership:yourmembership-certifications-api
  name: YourMembership Certifications API
  tags:
  - Certifications
  - Continuing Education
  - Learning
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.yourmembership.com/api/
  baseURL: https://ws.yourmembership.com
  properties:
  - url: https://www.yourmembership.com/api/
    type: Documentation
  - url: openapi/yourmembership-openapi.yml
    type: OpenAPI
  description: Track member certifications, credentials, and continuing-education (CE)
    credits tied to a member record. YourMembership and Community Brands offer
    certification and learning functionality; a standalone public certifications
    API is not separately documented, so this surface is honestly modeled against
    the member-centric data model (endpointsModeled).
- aid: yourmembership:yourmembership-careers-api
  name: YMCareers API
  tags:
  - Careers
  - Jobs
  - Job Board
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://api-doc.careerwebsite.com/
  baseURL: https://api.careerwebsite.com/v1
  properties:
  - url: https://api-doc.careerwebsite.com/
    type: Documentation
  - url: https://api-doc.careerwebsite.com/
    type: APIReference
  - url: openapi/yourmembership-openapi.yml
    type: OpenAPI
  description: REST API for the YMCareers online career center / job board. JSON
    responses over https://api.careerwebsite.com/v1, authenticated with an
    API_ACCESS_TOKEN (15-minute) or a non-expiring X-API-KEY. Covers job search,
    lead generation, location autocomplete, job-seeker activity (resume uploads,
    applications, job alerts), recruiter registration, and event reporting.
    Credentials are requested from YMPartnerReps@momentivesoftware.com.
- aid: yourmembership:yourmembership-content-api
  name: YourMembership Content and Community API
  tags:
  - Content
  - Community
  - Groups
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.yourmembership.com/api/
  baseURL: https://ws.yourmembership.com
  properties:
  - url: https://www.yourmembership.com/api/
    type: Documentation
  - url: openapi/yourmembership-openapi.yml
    type: OpenAPI
  description: Access online-community and content constructs - groups/subgroups,
    member messaging (in-box, read/unread status), journals/content, and media -
    that YourMembership exposes to organizations engaging their members. Grounded
    in the documented community/messaging capability of the platform; specific REST
    paths are modeled.
- aid: yourmembership:yourmembership-commerce-api
  name: YourMembership Commerce and Sales API
  tags:
  - Commerce
  - Store
  - Transactions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.yourmembership.com/api/
  baseURL: https://ws.yourmembership.com
  properties:
  - url: https://www.yourmembership.com/api/
    type: Documentation
  - url: openapi/yourmembership-openapi.yml
    type: OpenAPI
  description: Retrieve e-commerce and financial data - YM Store orders and order
    status (open, processed, shipped, closed, cancelled), transactions, dues
    payments, and donation/fundraising exports - for reconciliation with finance
    and CRM systems. Grounded in the documented store-order and system-admin export
    calls of the legacy XML API; REST paths are modeled.
