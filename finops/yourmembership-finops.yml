description: >-
  FinOps view of YourMembership spend. YourMembership is sold as an annual,
  quote-based SaaS subscription (not a usage-metered API product), owned by
  Community Brands and operating under Momentive Software / the Personify
  portfolio. The dominant costs are the annual platform subscription, a one-time
  implementation/setup fee, and optional add-ons (data migration, training,
  website work, integrations, YMCareers). The developer APIs do not carry a
  separate per-call meter: the legacy XML API is included for customers, the REST
  API is a licensed capability, and the YMCareers API is bundled with the
  YMCareers product. Cost management is therefore about contract/subscription
  optimization and renewal negotiation rather than per-request metering.
notes: >-
  All amounts are third-party estimates, not vendor list prices. Reviewers note
  annual price increases at renewal, so budget for uplift. Reconcile actual
  subscription, implementation, and API/YMCareers licensing terms with Momentive
  Software.
