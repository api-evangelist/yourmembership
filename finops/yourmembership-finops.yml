principles:
- name: Visibility
  description: Track the annual subscription, one-time implementation, and each add-on/module (including REST API licensing and YMCareers) as distinct line items.
- name: Allocation
  description: Attribute the subscription and API licensing to the association program or department that owns the member data.
- name: Optimization
  description: Right-size modules and add-ons to actual use; negotiate renewal uplift proactively; prefer the included XML API or batched exports over paid integration work where feasible.
- name: Accountability
  description: Assign an owner to the vendor relationship; review renewal quotes annually against member count and module utilization.
