openapi: 3.2.0
info:
  title: YourMembership Content and Community API
  description: A description of the YourMembership developer API surface.
  version: '1.0'
  contact:
    name: YourMembership (Momentive Software)
    url: https://www.yourmembership.com/api/
servers:
- url: https://ws.yourmembership.com
  description: YourMembership REST API (YM AMS)
- url: https://api.careerwebsite.com/v1
  description: YMCareers REST API (job board / career center)
security:
- oauth2: []
tags:
- name: Content and Community
  description: Groups, messaging, journals, and community content. Modeled.
paths:
  /Ams/Community/Messages:
    get:
      tags:
      - Content and Community
      summary: List member messages
      description: Modeled. Reads community in-box messaging with read/unread status. The legacy XML API documents sent/received message calls and read status.
      operationId: listMessages
      responses:
        '200':
          description: A list of member messages.
  /Ams/Community/Groups:
    get:
      tags:
      - Content and Community
      summary: List groups / subgroups
      description: Modeled. Lists community groups and subgroups and their membership.
      operationId: listGroups
      responses:
        '200':
          description: A list of groups.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth authentication for the YM REST API, established via POST /Ams/Authenticate. The YMCareers API instead uses an API_ACCESS_TOKEN (15-minute) Authorization header or a non-expiring X-API-KEY header.
      flows:
        clientCredentials:
          tokenUrl: https://ws.yourmembership.com/Ams/Authenticate
          scopes: {}
