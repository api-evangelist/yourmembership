openapi: 3.2.0
info:
  title: YourMembership Events API
  description: A description of the YourMembership developer API surface.
  version: '1.0'
  contact:
    name: YourMembership (Momentive Software)
    url: https://www.yourmembership.com/api/
servers:
- url: https://ws.yourmembership.com
  description: YourMembership REST API (YM AMS)
- url: https://api.careerwebsite.com/v1
  description: YMCareers REST API (job board / career center)
security:
- oauth2: []
tags:
- name: Events
  description: Events, event details, and registrations (YM Events module). Modeled.
paths:
  /Ams/Events:
    get:
      tags:
      - Events
      summary: List events
      description: Modeled from the documented YM Events module and the legacy XML API Events search capability. Lists events and event details.
      operationId: listEvents
      responses:
        '200':
          description: A list of events.
  /Ams/Events/{eventId}/Registrations:
    get:
      tags:
      - Events
      summary: List registrations for an event
      description: Modeled. Retrieves registrations for a given event.
      operationId: listEventRegistrations
      parameters:
      - name: eventId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: A list of event registrations.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth authentication for the YM REST API, established via POST /Ams/Authenticate. The YMCareers API instead uses an API_ACCESS_TOKEN (15-minute) Authorization header or a non-expiring X-API-KEY header.
      flows:
        clientCredentials:
          tokenUrl: https://ws.yourmembership.com/Ams/Authenticate
          scopes: {}
