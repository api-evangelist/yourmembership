openapi: 3.2.0
info:
  title: YourMembership Members API
  description: A description of the YourMembership developer API surface.
  version: '1.0'
  contact:
    name: YourMembership (Momentive Software)
    url: https://www.yourmembership.com/api/
servers:
- url: https://ws.yourmembership.com
  description: YourMembership REST API (YM AMS)
- url: https://api.careerwebsite.com/v1
  description: YMCareers REST API (job board / career center)
security:
- oauth2: []
tags:
- name: Members
  description: Member and contact records, profiles, and custom fields (confirmed MemberProfile / People endpoints).
paths:
  /Ams/MemberProfile:
    get:
      tags:
      - Members
      summary: Read member profiles / contacts (ReadContacts)
      description: Confirmed endpoint. Reads member profiles and contact records, including custom fields, via the MemberProfile resource. Used by integration partners' ReadContacts operation.
      operationId: readContacts
      parameters:
      - name: since
        in: query
        required: false
        schema:
          type: string
          format: date-time
        description: Return records modified since this timestamp.
      - name: pageSize
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: A list of member profiles / contacts.
    post:
      tags:
      - Members
      summary: Create or update a member profile
      description: Modeled. Create or update member records and profile data. The public integration guides confirm member create/update capability; the exact request shape is not published.
      operationId: upsertMemberProfile
      responses:
        '200':
          description: Member profile created or updated.
  /Ams/People:
    get:
      tags:
      - Members
      summary: Read an individual contact (ReadContact)
      description: Confirmed endpoint. Reads a single person/contact record via the People resource. Used by integration partners' ReadContact operation.
      operationId: readContact
      parameters:
      - name: id
        in: query
        required: false
        schema:
          type: string
        description: Member/contact identifier.
      responses:
        '200':
          description: A single contact record.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth authentication for the YM REST API, established via POST /Ams/Authenticate. The YMCareers API instead uses an API_ACCESS_TOKEN (15-minute) Authorization header or a non-expiring X-API-KEY header.
      flows:
        clientCredentials:
          tokenUrl: https://ws.yourmembership.com/Ams/Authenticate
          scopes: {}
