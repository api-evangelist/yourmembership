openapi: 3.2.0
info:
  title: YourMembership Certifications API
  description: A description of the YourMembership developer API surface.
  version: '1.0'
  contact:
    name: YourMembership (Momentive Software)
    url: https://www.yourmembership.com/api/
servers:
- url: https://ws.yourmembership.com
  description: YourMembership REST API (YM AMS)
- url: https://api.careerwebsite.com/v1
  description: YMCareers REST API (job board / career center)
security:
- oauth2: []
tags:
- name: Certifications
  description: Member certifications, credentials, and continuing-education credits. Modeled.
paths:
  /Ams/Certifications:
    get:
      tags:
      - Certifications
      summary: List member certifications and CE credits
      description: Modeled. Returns certifications, credentials, and continuing-education credits associated with member records. YourMembership / Community Brands offer certification and learning functionality, but a standalone public certifications API is not separately documented.
      operationId: listCertifications
      parameters:
      - name: memberId
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: A list of certifications / CE records.
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: OAuth authentication for the YM REST API, established via POST /Ams/Authenticate. The YMCareers API instead uses an API_ACCESS_TOKEN (15-minute) Authorization header or a non-expiring X-API-KEY header.
      flows:
        clientCredentials:
          tokenUrl: https://ws.yourmembership.com/Ams/Authenticate
          scopes: {}
